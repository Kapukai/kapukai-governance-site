<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Follow the decision. Follow the money.</title><rect width="1080" height="1350" fill="#101f30"/><text x="64" y="70" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">KAPUKAI  /  CAROL WOODS  /  02</text><text x="64" y="166" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="54" font-weight="700">Follow the decision. Follow</text><text x="64" y="238.9" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="54" font-weight="700">the money.</text><text x="64" y="299.8" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">The care placements economy is documented. A financial motive in a particular</text><text x="64" y="329.5" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">custody decision requires separate evidence.</text><rect x="64" y="350" width="952" height="136" rx="12" fill="#203448"/><text x="88" y="392" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">PUBLIC FUNDS</text><text x="88" y="441" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">Local authorities purchase care placements.</text><path d="M540 489v33m-9 -13l9 13 9 -13" fill="none" stroke="#f2c478" stroke-width="4"/><rect x="64" y="528" width="952" height="136" rx="12" fill="#203448"/><text x="88" y="570" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">PLACEMENT PAYMENTS</text><text x="88" y="619" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">Independent providers receive payment for care.</text><path d="M540 667v33m-9 -13l9 13 9 -13" fill="none" stroke="#f2c478" stroke-width="4"/><rect x="64" y="706" width="952" height="136" rx="12" fill="#203448"/><text x="88" y="748" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">PROVIDER REVENUE</text><text x="88" y="797" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">Some providers operate for profit.</text><rect x="64" y="910" width="952" height="224" rx="12" fill="#087b78"/><text x="88" y="1001" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="72" font-weight="700">22.6%</text><text x="390" y="971" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700">Average operating margin</text><text x="390" y="1010" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400">Children’s homes providers in the CMA</text><text x="390" y="1043.75" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="400">sample, 2016–2020.</text><text x="88" y="1074" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400">This is not a payment for removing a child and does not establish</text><text x="88" y="1106.4" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="400">Woods’s allegations.</text><text x="64" y="1213" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Source: CMA, Children’s social care market study, final report (10 March 2022),</text><text x="64" y="1240.0" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Summary. Historical sample; not a current sector-wide estimate.</text><text x="64" y="1310" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">kapukai.org/evidence/carol-woods/</text></svg>