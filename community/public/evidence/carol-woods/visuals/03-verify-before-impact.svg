<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Verification must keep pace with power.</title><rect width="1080" height="1350" fill="#101f30"/><text x="64" y="70" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">KAPUKAI  /  CAROL WOODS  /  03</text><text x="64" y="166" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="54" font-weight="700">Verification must keep pace</text><text x="64" y="238.9" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="54" font-weight="700">with power.</text><text x="64" y="299.8" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">Kapukai proposal: evidence checks at the decision point, with urgent protection</text><text x="64" y="329.5" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">and rapid independent review when needed.</text><rect x="64" y="355" width="952" height="116" rx="12" fill="#203448"/><text x="86" y="393" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">SOURCE</text><text x="86" y="434" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400">Who observed it? When? Where is the original?</text><rect x="64" y="495" width="952" height="116" rx="12" fill="#203448"/><text x="86" y="533" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">CHANGE</text><text x="86" y="574" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400">Who edited it? What changed? Why?</text><rect x="64" y="635" width="952" height="116" rx="12" fill="#203448"/><text x="86" y="673" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">CHALLENGE</text><text x="86" y="714" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400">What contradicts it? Has the affected person responded?</text><rect x="64" y="775" width="952" height="116" rx="12" fill="#203448"/><text x="86" y="813" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">DECISION</text><text x="86" y="854" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400">Who acted? Under what authority and evidence?</text><rect x="64" y="915" width="952" height="116" rx="12" fill="#203448"/><text x="86" y="953" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700">CORRECTION</text><text x="86" y="994" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="400">Who must recheck decisions when evidence changes?</text><text x="64" y="1120" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="35" font-weight="700">Protect the person. Expose the decision.</text><text x="64" y="1213" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Design proposal, not an operating verification service. Publish reviewable reasons</text><text x="64" y="1240.0" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">and evidence status while protecting children and private records.</text><text x="64" y="1310" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">kapukai.org/evidence/carol-woods/</text></svg>