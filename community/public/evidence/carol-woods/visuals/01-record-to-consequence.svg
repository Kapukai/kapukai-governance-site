<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>A record can change a life.</title><rect width="1080" height="1350" fill="#101f30"/><text x="64" y="70" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">KAPUKAI  /  CAROL WOODS  /  01</text><text x="64" y="166" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="54" font-weight="700">A record can change a life.</text><text x="64" y="226.9" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">What verifies the record? A risk pathway illustrated by Woods’s testimony, not a</text><text x="64" y="256.6" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">proven reconstruction of a case.</text><rect x="64" y="360" width="952" height="178" rx="12" fill="#203448"/><text x="88" y="401" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">01  THE SOURCE</text><text x="88" y="446" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">Woods says records appeared without a source she could</text><text x="88" y="485.15" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">identify.</text><text x="88" y="519" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Transcript 01:18–01:45</text><path d="M540 541v33m-9 -13l9 13 9 -13" fill="none" stroke="#f2c478" stroke-width="4"/><rect x="64" y="578" width="952" height="178" rx="12" fill="#203448"/><text x="88" y="619" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">02  THE FILE</text><text x="88" y="664" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">She alleges pressure to change a child’s file in the</text><text x="88" y="703.15" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">authority’s favor.</text><text x="88" y="737" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Transcript 05:23–05:52</text><path d="M540 759v33m-9 -13l9 13 9 -13" fill="none" stroke="#f2c478" stroke-width="4"/><rect x="64" y="796" width="952" height="178" rx="12" fill="#203448"/><text x="88" y="837" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700">03  THE COURT</text><text x="88" y="882" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">She alleges crucial documents were removed and altered</text><text x="88" y="921.15" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="400">material reached court.</text><text x="88" y="955" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Transcript 11:15–11:54</text><text x="64" y="1071" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700">If the record is wrong, every decision</text><text x="64" y="1119.6" fill="#f8f5ec" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700">that relies on it needs review.</text><text x="64" y="1213" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">Source: Kapukai-hosted UK Column interview transcript. Allegations have not been</text><text x="64" y="1240.0" fill="#bccbd5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400">independently established by this visual; audio alignment remains to be checked.</text><text x="64" y="1310" fill="#f2c478" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400">kapukai.org/evidence/carol-woods/</text></svg>