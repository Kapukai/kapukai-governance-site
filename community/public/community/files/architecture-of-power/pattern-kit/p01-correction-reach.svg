<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P01: Correction must reach the consequence</title><desc id="card-desc">Illustrative paired networks: an original decision reaches several recipients; the correction route must reach each place where consequences persist.</desc><metadata>{&quot;id&quot;: &quot;P01&quot;, &quot;title&quot;: &quot;Correction must reach the consequence&quot;, &quot;source_ids&quot;: [&quot;stpa-handbook-2018&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p01&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P01</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Correction must reach the</tspan><tspan x="64" dy="58">consequence</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">A correction may arrive at the source while consequences</tspan><tspan x="64" dy="37">continue wherever the earlier information traveled.</tspan></text><path d="M 284 449.6 L 346 449.6 L 346 357.8 L 414 357.8" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 284 449.6 L 346 449.6 L 346 550.75 L 414 550.75" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)"/><path d="M 644 357.8 L 714 357.8 L 714 437.7 L 779 437.7" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 644 550.75 L 714 550.75 L 714 461.5 L 779 461.5" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)"/><path d="M 181 490.4 L 181 622.15 L 529 622.15 L 529 592.4" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><rect x="79" y="408.8" width="205" height="81.6" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="181.5" y="442.6" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="181.5" dy="0">Corrected</tspan><tspan x="181.5" dy="32">source</tspan></text><rect x="414" y="317" width="230" height="81.6" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="529" y="350.8" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="529" dy="0">Recipient A</tspan><tspan x="529" dy="32">updated</tspan></text><rect x="414" y="509.95" width="230" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="529" y="543.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="529" dy="0">Recipient B</tspan><tspan x="529" dy="32">old copy</tspan></text><rect x="779" y="408.8" width="222" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="890" y="442.6" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="890" dy="0">Consequence</tspan><tspan x="890" dy="32">persists</tspan></text><rect x="247.555" y="598.25" width="204.891" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="350" y="627.25" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="350" dy="0">Send + verify</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Trace one accepted correction through every</tspan><tspan x="248" dy="35">known recipient that used the earlier information.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Compare recipients updated, restrictions removed,</tspan><tspan x="248" dy="35">and elapsed time with the original information’s</tspan><tspan x="248" dy="35">reach.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Assign correction owners, confirm recipient</tspan><tspan x="248" dy="35">updates, and check whether downstream</tspan><tspan x="248" dy="35">consequences actually end.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Fast propagation helps timely action; it also needs</tspan><tspan x="248" dy="35">reliable correction paths and limits on</tspan><tspan x="248" dy="35">unnecessary sharing.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p01" aria-label="Source notes for P01"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P01</tspan></text></a></svg>
