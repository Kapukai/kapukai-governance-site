<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P07: Independent review, connected repair</title><desc id="card-desc">A conceptual map preserving independent review while connecting authorized interim protection and implementation of a remedy.</desc><metadata>{&quot;id&quot;: &quot;P07&quot;, &quot;title&quot;: &quot;Independent review, connected repair&quot;, &quot;source_ids&quot;: [&quot;nist-systems-engineering-2022&quot;, &quot;oecd-human-centred-services-2024&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p07&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P07</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Independent review, connected</tspan><tspan x="64" dy="58">repair</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Independent review needs connected repair and a clearly</tspan><tspan x="64" dy="37">assigned, lawful route to interim protection where available.</tspan></text><path d="M 319 447.05 L 354 447.05 L 354 356.1 L 418 356.1" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 679 356.1 L 886 356.1 L 886 423.25" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 319 467.45 L 354 467.45 L 354 561.8 L 418 561.8" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 679 561.8 L 886 561.8 L 886 501.45" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 774 485.3 L 714 485.3 L 320 485.3" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><rect x="79" y="423.25" width="240" height="81.6" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="199" y="457.05" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="199" dy="0">Concern +</tspan><tspan x="199" dy="32">evidence</tspan></text><rect x="419" y="312.75" width="260" height="86.7" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="549" y="349.1" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="549" dy="0">Independent</tspan><tspan x="549" dy="32">review</tspan></text><rect x="419" y="521" width="260" height="81.6" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6" stroke-dasharray="7 6"/><text x="549" y="554.8" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="549" dy="0">Authorized</tspan><tspan x="549" dy="32">pause?</tspan></text><rect x="774" y="423.25" width="227" height="81.6" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="887.5" y="457.05" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="887.5" dy="0">Lawful</tspan><tspan x="887.5" dy="32">action owner</tspan></text><rect x="799.352" y="311.8" width="129.297" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="864" y="340.8" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#526271"><tspan x="864" dy="0">Findings</tspan></text><rect x="445.055" y="449.5" width="209.891" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="550" y="478.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="550" dy="0">Repair receipt</tspan></text><text x="550" y="639.15" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="550" dy="0">Only where law allows</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Who has lawful authority to pause harmful action</tspan><tspan x="248" dy="35">pending review, under what conditions and</tspan><tspan x="248" dy="35">response time?</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Track pause requests, response times, review</tspan><tspan x="248" dy="35">dates, justified refusals, and whether authorized</tspan><tspan x="248" dy="35">relief reaches every responsible office.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Preserve independent review; define lawful pause</tspan><tspan x="248" dy="35">conditions, deadlines, review, and connected</tspan><tspan x="248" dy="35">repair without unnecessary data sharing.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">A pause can prevent worsening harm or interrupt</tspan><tspan x="248" dy="35">needed protection; define proportionate conditions</tspan><tspan x="248" dy="35">and prompt review.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p07" aria-label="Source notes for P07"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P07</tspan></text></a></svg>
