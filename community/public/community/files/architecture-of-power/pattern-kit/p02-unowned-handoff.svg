<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P02: The unowned handoff</title><desc id="card-desc">Illustrative handoff between offices: a referral reaches a boundary, but responsibility must be accepted by a receiving owner.</desc><metadata>{&quot;id&quot;: &quot;P02&quot;, &quot;title&quot;: &quot;The unowned handoff&quot;, &quot;source_ids&quot;: [&quot;stpa-handbook-2018&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p02&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P02</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">The unowned handoff</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">A referral can move the paperwork without transferring</tspan><tspan x="64" dy="37">responsibility for the next decision.</tspan></text><path d="M 319 380.75 L 418 380.75" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 659 380.75 L 768 380.75" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)" stroke-dasharray="7 6"/><path d="M 539 423.25 L 539 507.4" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 684 555 L 884 555 L 884 424.1" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><rect x="79" y="338.25" width="240" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="199" y="373.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="199" dy="0">Sending</tspan><tspan x="199" dy="32">office</tspan></text><rect x="419" y="338.25" width="240" height="85" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6" stroke-dasharray="7 6"/><text x="539" y="373.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="539" dy="0">Who owns</tspan><tspan x="539" dy="32">the next step?</tspan></text><rect x="769" y="338.25" width="230" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="884" y="373.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="884" dy="0">Receiving</tspan><tspan x="884" dy="32">office</tspan></text><rect x="319" y="508.25" width="365" height="93.5" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="501.5" y="548" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="501.5" dy="0">Owner + deadline</tspan><tspan x="501.5" dy="32">+ acceptance</tspan></text><rect x="486.172" y="449.5" width="105.656" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="539" y="478.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="539" dy="0">Assign</tspan></text><rect x="829.273" y="456.3" width="109.453" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="884" y="485.3" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="884" dy="0">Accept</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">At each transfer, identify who accepts the task</tspan><tspan x="248" dy="35">and who can resolve a stalled handoff.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Count transfers without acknowledgment,</tspan><tspan x="248" dy="35">unresolved ownership disputes, and time spent</tspan><tspan x="248" dy="35">waiting between offices.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Name the receiving owner, require acceptance,</tspan><tspan x="248" dy="35">and define escalation when responsibility remains</tspan><tspan x="248" dy="35">disputed.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Specialization can improve decisions, but</tspan><tspan x="248" dy="35">additional handoffs need explicit responsibility and</tspan><tspan x="248" dy="35">enough context.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p02" aria-label="Source notes for P02"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P02</tspan></text></a></svg>
