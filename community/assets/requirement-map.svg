<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="requirement-map-title requirement-map-desc">
  <title id="requirement-map-title">Illustrative requirement dependency map</title>
  <desc id="requirement-map-desc">An invented workflow, not a claim about an agency. Requirement A and Requirement B both request the same identity evidence E through separate intake forms. Both records feed one consequential decision and a downstream effect. A correction request reaches the decision, but the route to the downstream effect has no assigned owner and asks, Who owns this update?</desc>
  <defs>
    <marker id="requirement-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker>
    <marker id="correction-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker>
  </defs>
  <rect width="1000" height="450" fill="#F8F6F0"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#142D42">
    <text x="24" y="31" font-size="24" font-weight="600">Illustrative requirement dependency map</text>
    <text x="24" y="55" font-size="14">Invented requirements and handoffs for explanation. No agency process or finding is represented.</text>

    <g font-size="12" font-weight="600" letter-spacing="1.1" fill="#526271">
      <text x="24" y="86">REQUIREMENTS</text>
      <text x="300" y="86">INTAKE</text>
      <text x="555" y="86">DECISION</text>
      <text x="800" y="86">EFFECT</text>
    </g>

    <g fill="none" stroke="#142D42" stroke-width="1.7" marker-end="url(#requirement-arrow)">
      <path d="M220 134H299"/>
      <path d="M220 258H299"/>
      <path d="M474 134H494L531 190H554"/>
      <path d="M474 258H494L531 218H554"/>
      <path d="M751 204H799"/>
    </g>

    <g fill="none" stroke="#17665D" stroke-width="2">
      <path d="M260 146V246" stroke-dasharray="3 4"/>
      <path d="M220 364H653V245" marker-end="url(#correction-arrow)"/>
      <path d="M653 364H799" stroke-dasharray="6 5" marker-end="url(#correction-arrow)"/>
      <path d="M888 322V245" stroke-dasharray="6 5" marker-end="url(#correction-arrow)"/>
    </g>
    <circle cx="653" cy="364" r="4" fill="#17665D"/>

    <g fill="#F8F6F0" stroke="#17665D" stroke-width="1.5">
      <circle cx="260" cy="134" r="11"/>
      <circle cx="260" cy="258" r="11"/>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="600">
      <text x="260" y="139">E</text>
      <text x="260" y="263">E</text>
    </g>
    <rect x="221" y="178" width="78" height="40" fill="#F8F6F0"/>
    <g text-anchor="middle" font-size="13" fill="#17665D">
      <text x="260" y="192">Duplicate</text>
      <text x="260" y="209">request</text>
    </g>

    <g fill="#FFFDF8" stroke="#BCCBCB" stroke-width="1.2">
      <rect x="24" y="102" width="196" height="64" rx="7"/>
      <rect x="24" y="226" width="196" height="64" rx="7"/>
      <rect x="300" y="102" width="174" height="64" rx="7"/>
      <rect x="300" y="226" width="174" height="64" rx="7"/>
      <rect x="800" y="164" width="176" height="80" rx="7"/>
    </g>
    <rect x="555" y="164" width="196" height="80" rx="7" fill="#E7EEEA" stroke="#17665D" stroke-width="1.4"/>
    <rect x="24" y="336" width="196" height="56" rx="7" fill="#E7EEEA" stroke="#17665D" stroke-width="1.2"/>
    <rect x="800" y="322" width="176" height="84" rx="7" fill="#F8F6F0" stroke="#17665D" stroke-width="1.6" stroke-dasharray="6 5"/>

    <g text-anchor="middle">
      <g font-size="16" font-weight="600">
        <text x="122" y="127">Requirement A</text>
        <text x="122" y="251">Requirement B</text>
        <text x="387" y="127">Intake form A</text>
        <text x="387" y="251">Intake form B</text>
        <text x="653" y="188">Consequential</text>
        <text x="653" y="208">decision</text>
        <text x="888" y="191">Downstream effect</text>
        <text x="122" y="359">Correction request</text>
        <text x="888" y="347">Who owns</text>
        <text x="888" y="367">this update?</text>
      </g>
      <g font-size="13" fill="#526271">
        <text x="122" y="149">Requests identity evidence E</text>
        <text x="122" y="273">Requests identity evidence E</text>
        <text x="387" y="149">Creates intake record A</text>
        <text x="387" y="273">Creates intake record B</text>
        <text x="653" y="229">Uses both intake records</text>
        <text x="888" y="214">Access, benefit, or status</text>
        <text x="122" y="380">Identifies an error</text>
        <text x="888" y="390">No owner specified</text>
      </g>
    </g>

    <g font-size="13" fill="#17665D">
      <text x="326" y="351">Recheck / correct the decision</text>
      <text x="684" y="351">Handoff?</text>
      <text x="900" y="285">Update?</text>
    </g>
    <g font-size="13" fill="#526271">
      <text x="24" y="432">E = the same identity evidence requested twice</text>
      <path d="M590 428H626" stroke="#17665D" stroke-width="1.6" stroke-dasharray="6 5"/>
      <text x="637" y="432">Dashed correction route = owner unanswered</text>
    </g>
  </g>
</svg>
