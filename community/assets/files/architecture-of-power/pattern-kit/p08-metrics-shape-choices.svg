<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P08: Metrics shape choices</title><desc id="card-desc">A conceptual feedback loop linking performance targets, staff choices, measured outputs and checks of human outcomes.</desc><metadata>{&quot;id&quot;: &quot;P08&quot;, &quot;title&quot;: &quot;Metrics shape choices&quot;, &quot;source_ids&quot;: [&quot;gao-green-book-2025&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p08&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P08</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Metrics shape choices</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Targets can direct attention toward fast completion while</tspan><tspan x="64" dy="37">leaving accuracy, access, or lasting repair less visible.</tspan></text><path d="M 319 363.75 L 418 363.75" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 659 363.75 L 758 363.75" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 879 406.25 L 879 526.95" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 759 570.3 L 660 570.3" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 419 570.3 L 320 570.3" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 199 527.8 L 199 407.1" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><rect x="79" y="321.25" width="240" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="199" y="356.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="199" dy="0">Chosen</tspan><tspan x="199" dy="32">metric</tspan></text><rect x="419" y="321.25" width="240" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="539" y="356.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="539" dy="0">Behavior</tspan><tspan x="539" dy="32">adapts</tspan></text><rect x="759" y="321.25" width="240" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="879" y="356.75" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="879" dy="0">Human</tspan><tspan x="879" dy="32">effect</tspan></text><rect x="759" y="527.8" width="240" height="85" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="879" y="563.3" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="879" dy="0">Measure</tspan><tspan x="879" dy="32">actual effect</tspan></text><rect x="419" y="527.8" width="240" height="85" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="539" y="563.3" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="539" dy="0">Check for</tspan><tspan x="539" dy="32">blind spots</tspan></text><rect x="79" y="527.8" width="240" height="85" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="199" y="563.3" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="199" dy="0">Revise</tspan><tspan x="199" dy="32">the metric</tspan></text><rect x="465.312" y="445.25" width="147.375" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="539" y="474.25" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="539" dy="0">Feedback</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Compare rewarded targets with the outcomes the</tspan><tspan x="248" dy="35">service is supposed to deliver.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Review speed and volume alongside error rates,</tspan><tspan x="248" dy="35">unresolved harm, repeat work, and access across</tspan><tspan x="248" dy="35">groups.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Balance output targets with outcome checks,</tspan><tspan x="248" dy="35">review workload pressures, and investigate</tspan><tspan x="248" dy="35">unexpected changes in reported performance.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">More measures can reveal blind spots but increase</tspan><tspan x="248" dy="35">reporting work; keep the set small and</tspan><tspan x="248" dy="35">decision-relevant.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p08" aria-label="Source notes for P08"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P08</tspan></text></a></svg>
