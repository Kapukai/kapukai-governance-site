<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P05: Closed ticket, unresolved consequence</title><desc id="card-desc">Illustrative outcome chain: administrative closure is separated from verified restoration of the affected person’s situation.</desc><metadata>{&quot;id&quot;: &quot;P05&quot;, &quot;title&quot;: &quot;Closed ticket, unresolved consequence&quot;, &quot;source_ids&quot;: [&quot;gao-green-book-2025&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p05&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P05</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Closed ticket, unresolved</tspan><tspan x="64" dy="58">consequence</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Closing a complaint or completing a task does not, by itself,</tspan><tspan x="64" dy="37">show that the underlying problem was repaired.</tspan></text><path d="M 329 359.5 L 748 359.5" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 329 547.35 L 418 547.35" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 664 547.35 L 748 547.35" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 874 402 L 874 505.7" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)" stroke-dasharray="7 6"/><rect x="79" y="317" width="250" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="204" y="352.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="204" dy="0">Ticket</tspan><tspan x="204" dy="32">opened</tspan></text><rect x="749" y="317" width="250" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="874" y="352.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="874" dy="0">Ticket</tspan><tspan x="874" dy="32">closed</tspan></text><rect x="79" y="506.55" width="250" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="204" y="540.35" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="204" dy="0">Access</tspan><tspan x="204" dy="32">blocked</tspan></text><rect x="419" y="506.55" width="245" height="81.6" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="541.5" y="540.35" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="541.5" dy="0">Test actual</tspan><tspan x="541.5" dy="32">outcome</tspan></text><rect x="749" y="506.55" width="250" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="874" y="540.35" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="874" dy="0">Still</tspan><tspan x="874" dy="32">blocked</tspan></text><rect x="422.5" y="321.15" width="233" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="539" y="350.15" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#526271"><tspan x="539" dy="0">Status changed</tspan></text><rect x="743.445" y="440.15" width="243.109" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="865" y="469.15" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#A33D36"><tspan x="865" dy="0">Not a repair test</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Check the affected person’s situation after</tspan><tspan x="248" dy="35">administrative closure, including any continuing</tspan><tspan x="248" dy="35">restrictions.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Report closure separately from verified repair,</tspan><tspan x="248" dy="35">time to relief, and recurrence of the same</tspan><tspan x="248" dy="35">problem.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Define the outcome required for resolution, verify</tspan><tspan x="248" dy="35">it, and reopen cases when the problem persists.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="29" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Outcome verification takes resources; prioritize</tspan><tspan x="248" dy="35">serious consequences and avoid making affected</tspan><tspan x="248" dy="35">people repeatedly prove the same unresolved harm.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p05" aria-label="Source notes for P05"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P05</tspan></text></a></svg>
