<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P06: Less burden. Effective protection.</title><desc id="card-desc">A conceptual two-axis matrix comparing procedural burden and verified protection. No agencies or measured values are plotted.</desc><metadata>{&quot;id&quot;: &quot;P06&quot;, &quot;title&quot;: &quot;Less burden. Effective protection.&quot;, &quot;source_ids&quot;: [&quot;oecd-regulatory-policy-governance&quot;, &quot;oecd-human-centred-services-2024&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p06&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P06</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Less burden. Effective protection.</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">A procedural step should be judged by the protection it</tspan><tspan x="64" dy="37">provides alongside the effort and delay it imposes.</tspan></text><rect x="234" y="312.75" width="360" height="121.125" rx="0" fill="#E5EEE8" stroke="#D7DFDC" stroke-width="1.6"/><rect x="594" y="312.75" width="360" height="121.125" rx="0" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><rect x="234" y="433.875" width="360" height="121.125" rx="0" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><rect x="594" y="433.875" width="360" height="121.125" rx="0" fill="#F5E3DE" stroke="#D7DFDC" stroke-width="1.6"/><text x="414" y="359.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="414" dy="0">Lower burden</tspan><tspan x="414" dy="34">Stronger protection</tspan></text><text x="774" y="359.5" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="774" dy="0">Higher burden</tspan><tspan x="774" dy="34">Stronger protection</tspan></text><text x="414" y="480.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="414" dy="0">Lower burden</tspan><tspan x="414" dy="34">Weaker protection</tspan></text><text x="774" y="480.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="774" dy="0">Higher burden</tspan><tspan x="774" dy="34">Weaker protection</tspan></text><path d="M 234 571.15 L 954 571.15" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><text x="594" y="606" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#526271"><tspan x="594" dy="0">Burden increases</tspan></text><text x="137" y="436" transform="rotate(-90 137 436)" font-family="DejaVu Sans" font-size="28" text-anchor="middle" fill="#526271">Protection increases</text><path d="M 183 554.15 L 183 313.6" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><text x="594" y="639.15" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#526271"><tspan x="594" dy="0">Conceptual axes; no agencies plotted</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Ask what risk each requirement addresses and</tspan><tspan x="248" dy="35">who bears its time, cost, and accessibility</tspan><tspan x="248" dy="35">demands.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Compare errors prevented with completion time,</tspan><tspan x="248" dy="35">repeated submissions, abandonment, and unequal</tspan><tspan x="248" dy="35">access.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Remove duplication, offer accessible routes, and</tspan><tspan x="248" dy="35">retain safeguards that demonstrably protect rights</tspan><tspan x="248" dy="35">or public interests.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Simplification can remove friction or remove</tspan><tspan x="248" dy="35">protection; assess both before changing a</tspan><tspan x="248" dy="35">requirement.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p06" aria-label="Source notes for P06"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P06</tspan></text></a></svg>
