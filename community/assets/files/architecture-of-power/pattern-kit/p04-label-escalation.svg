<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P04: Labels outrun their evidence</title><desc id="card-desc">Illustrative label history: a provisional assertion becomes a stronger classification without visible new support, prompting an evidence check.</desc><metadata>{&quot;id&quot;: &quot;P04&quot;, &quot;title&quot;: &quot;Labels outrun their evidence&quot;, &quot;source_ids&quot;: [&quot;stpa-handbook-2018&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p04&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P04</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Labels outrun their evidence</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">A tentative label can acquire greater authority as it travels</tspan><tspan x="64" dy="37">even when its supporting evidence has not changed.</tspan></text><path d="M 264 395.2 L 323 395.2" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 509 395.2 L 568 395.2" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)" stroke-dasharray="6 5"/><path d="M 754 395.2 L 813 395.2" fill="none" stroke="#A33D36" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#failure-arrow)"/><path d="M 416 436 L 349 495.5 L 349 565.2 L 398 565.2" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><path d="M 699 565.2 L 754 565.2 L 754 495.5 L 661 495.5 L 661 436.85" fill="none" stroke="#17665D" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#repair-arrow)"/><rect x="79" y="354.4" width="185" height="81.6" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="171.5" y="404.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="171.5" dy="0">Reported</tspan></text><rect x="324" y="354.4" width="185" height="81.6" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="416.5" y="404.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="416.5" dy="0">Recorded</tspan></text><rect x="569" y="354.4" width="185" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="661.5" y="388.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="661.5" dy="0">Treated</tspan><tspan x="661.5" dy="32">as fact</tspan></text><rect x="814" y="354.4" width="185" height="81.6" rx="10" fill="#F5E3DE" stroke="#A33D36" stroke-width="1.6"/><text x="906.5" y="404.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="906.5" dy="0">Action</tspan></text><rect x="399" y="527.8" width="300" height="74.8" rx="10" fill="#E5EEE8" stroke="#17665D" stroke-width="1.6"/><text x="549" y="574.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="549" dy="0">Evidence gate</tspan></text><text x="539" y="364.6" font-family="DejaVu Sans" font-size="32" font-weight="400" text-anchor="middle" fill="#A33D36"><tspan x="539" dy="0">?</tspan></text><rect x="421.344" y="452.9" width="235.312" height="36" rx="2" fill="#F8F6F0" stroke="#F8F6F0" stroke-width="0"/><text x="539" y="481.9" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#A33D36"><tspan x="539" dy="0">No new support</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Track where an allegation, provisional assessment,</tspan><tspan x="248" dy="35">or confirmed finding changes category or triggers</tspan><tspan x="248" dy="35">a stronger response.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Count escalations without a traceable evidentiary</tspan><tspan x="248" dy="35">basis, applicable rule, or authorized review.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Keep allegations, assessments, and findings</tspan><tspan x="248" dy="35">distinct; require evidence and authorized review</tspan><tspan x="248" dy="35">before changing status.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Early warnings can support protection; provisional</tspan><tspan x="248" dy="35">status and timely review help limit unsupported</tspan><tspan x="248" dy="35">consequences.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p04" aria-label="Source notes for P04"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P04</tspan></text></a></svg>
