<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="card-title card-desc"><title id="card-title">P03: Copies are not independent corroboration</title><desc id="card-desc">Illustrative provenance network: one source is copied into several records; copies are distinguished from independent observations.</desc><metadata>{&quot;id&quot;: &quot;P03&quot;, &quot;title&quot;: &quot;Copies are not independent corroboration&quot;, &quot;source_ids&quot;: [&quot;w3c-prov-overview&quot;], &quot;source_notes_url&quot;: &quot;https://kapukai-community.vercel.app/architecture-of-power/patterns/#p03&quot;, &quot;claim_type&quot;: &quot;conceptual illustration and proposed tests&quot;, &quot;verification_state&quot;: &quot;not an empirical finding&quot;, &quot;version&quot;: &quot;1.0&quot;}</metadata><defs><marker id="flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#142D42"/></marker><marker id="repair-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#17665D"/></marker><marker id="failure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#A33D36"/></marker></defs><rect width="1080" height="1350" fill="#F8F6F0"/><text x="64" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">ILLUSTRATIVE PATTERN</tspan></text><text x="984" y="55" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="middle" fill="#17665D"><tspan x="984" dy="0">P03</tspan></text><rect x="64" y="76" width="88" height="4" rx="0" fill="#B58C45" stroke="#B58C45" stroke-width="0"/><text x="64" y="137" font-family="DejaVu Serif" font-size="50" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Copies are not independent</tspan><tspan x="64" dy="58">corroboration</tspan></text><text x="64" y="233" font-family="DejaVu Sans" font-size="31" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Several matching records may repeat one assertion rather</tspan><tspan x="64" dy="37">than provide several independent reasons to believe it.</tspan></text><path d="M 299 466.6 L 362 466.6 L 362 349.3 L 418 349.3" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 639 349.3 L 699 349.3 L 699 466.6 L 763 466.6" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 299 466.6 L 362 466.6 L 362 466.6 L 418 466.6" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 639 466.6 L 699 466.6 L 699 466.6 L 763 466.6" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 299 466.6 L 362 466.6 L 362 583.9 L 418 583.9" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><path d="M 639 583.9 L 699 583.9 L 699 466.6 L 763 466.6" fill="none" stroke="#142D42" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/><rect x="79" y="424.1" width="220" height="85" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="189" y="459.6" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="189" dy="0">One original</tspan><tspan x="189" dy="32">assertion</tspan></text><rect x="419" y="312.75" width="220" height="73.1" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="529" y="358.3" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="529" dy="0">Copy A1</tspan></text><rect x="419" y="430.05" width="220" height="73.1" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="529" y="475.6" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="529" dy="0">Copy A2</tspan></text><rect x="419" y="547.35" width="220" height="73.1" rx="10" fill="#FFFDFA" stroke="#D7DFDC" stroke-width="1.6"/><text x="529" y="592.9" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="529" dy="0">Copy A3</tspan></text><rect x="764" y="424.1" width="237" height="85" rx="10" fill="#ECEEE8" stroke="#D7DFDC" stroke-width="1.6"/><text x="882.5" y="459.6" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#142D42"><tspan x="882.5" dy="0">One source,</tspan><tspan x="882.5" dy="32">three copies</tspan></text><text x="186" y="582.2" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="middle" fill="#17665D"><tspan x="186" dy="0">Trace origins</tspan></text><path d="M 64 675 L 1016 675" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="721" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Observe</tspan></text><text x="248" y="721" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Follow each supporting record back to its</tspan><tspan x="248" dy="35">originating evidence and later transformations.</tspan></text><text x="64" y="841" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Measure</tspan></text><text x="248" y="841" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Count independent source observations</tspan><tspan x="248" dy="35">separately from copies, summaries, and records</tspan><tspan x="248" dy="35">derived from the same source.</tspan></text><text x="64" y="961" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Repair</tspan></text><text x="248" y="961" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Preserve provenance and distinguish independent</tspan><tspan x="248" dy="35">support from repeated claims before weighing the</tspan><tspan x="248" dy="35">evidence.</tspan></text><text x="64" y="1081" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Tradeoff</tspan></text><text x="248" y="1081" font-family="DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="248" dy="0">Sharing improves access, but repetition must not</tspan><tspan x="248" dy="35">be treated as additional independent evidence.</tspan></text><path d="M 64 1189 L 1016 1189" fill="none" stroke="#D7DFDC" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="1224" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#526271"><tspan x="64" dy="0">Conceptual pattern • Proposed tests</tspan></text><text x="64" y="1263" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#142D42"><tspan x="64" dy="0">Kapukai Governance Lab • v1.0</tspan></text><a href="https://kapukai-community.vercel.app/architecture-of-power/patterns/#p03" aria-label="Source notes for P03"><text x="64" y="1302" font-family="DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" fill="#17665D"><tspan x="64" dy="0">Source notes: Kapukai Visual Pattern Library · P03</tspan></text></a></svg>
